[project]
name = "ai-tools"
version = "0.1.0"
description = "Personal AI tools for daily work"
readme = "README.md"
authors = [
    { name = "Robin Garg", email = "robin.garg@netsmartz.net" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "redis>=7.4.0",
    "reportlab>=4.4.10",
]

[project.scripts]
ai-tools = "ai_tools.flexisip.cli:cli"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
